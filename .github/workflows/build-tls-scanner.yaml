name: Build tls-scanner image
# Builds the tls-scanner image from the latest main of
# https://github.com/openshift/tls-scanner using its Dockerfile.local
# (public base images only, no CI registry credentials needed).
#
# Uploads to GitHub Container Registry (ghcr.io):
#   - on push to main
#   - on workflow_dispatch with the "push" checkbox checked
# Tags pushed: :latest (main only) and :<short-sha> of the built tls-scanner
# commit. PRs and unchecked dispatches build only (validation).
#
# Authentication uses the built-in GITHUB_TOKEN (via `packages: write` permission).
# Default destination is ghcr.io/<owner>/<repo>. Override via the
# TLS_SCANNER_REPOSITORY repository variable if needed (e.g. "my-org/tls-scanner").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      push:
        description: "Push the built image to the registry"
        type: boolean
        default: false
      ref:
        description: "openshift/tls-scanner ref to build (branch, tag or SHA)"
        type: string
        default: "main"

concurrency:
  group: build-tls-scanner-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TLS_SCANNER_REPO: openshift/tls-scanner
  REGISTRY: ghcr.io
  REPOSITORY: ${{ vars.TLS_SCANNER_REPOSITORY || github.repository }}

permissions: {}

jobs:
  build:
    name: Build (and push) tls-scanner image
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:

      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check out tls-scanner sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: tls-scanner
          repository: ${{ env.TLS_SCANNER_REPO }}
          ref: ${{ inputs.ref || 'main' }}
          persist-credentials: false

      - name: Edit sources
        working-directory: tls-scanner
        run: |
          set -Eeuox pipefail
          
          # default TARGETARCH breaks automatic assignment in multi-arch builds
          sed 's/^ARG TARGETARCH=.*/ARG TARGETARCH/' Dockerfile.local > Dockerfile.local.edited

      - name: Calculate image tags and push decision
        id: meta
        env:
          REF: ${{ inputs.ref || 'main' }}
          INPUT_PUSH: ${{ inputs.push }}
        working-directory: tls-scanner
        run: |
          set -euo pipefail
          # REF arrives from a dispatch input; validate before use.
          if [[ ! "$REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Invalid tls-scanner ref: '$REF'" >&2
            exit 1
          fi
          # GHCR requires lowercase repository paths
          repo_lower="$(echo "${REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${repo_lower}"
          short_sha="$(git rev-parse --short=12 HEAD)"
          tags="${image}:${short_sha}"
          # :latest must only follow the default branch of tls-scanner
          if [[ "$REF" == "main" ]]; then
            tags="${tags},${image}:latest"
          fi
          # Upload on push to main, or on a dispatch with the push checkbox
          push=false
          if [[ "$GITHUB_EVENT_NAME" == "push" || "$INPUT_PUSH" == "true" ]]; then
            push=true
          fi
          {
            echo "image=${image}"
            echo "short_sha=${short_sha}"
            echo "tags=${tags}"
            echo "push=${push}"
          } >> "$GITHUB_OUTPUT"
          echo "Image: ${image}"
          echo "Tags: ${tags}"
          echo "Push: ${push}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,ppc64le,s390x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GitHub Container Registry
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: tls-scanner/
          file: tls-scanner/Dockerfile.local.edited
          platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/s390x
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          # Skip cache export unless we push (fork PRs cannot write the branch cache)
          cache-to: ${{ steps.meta.outputs.push == 'true' && 'type=gha,mode=max' || '' }}
          # Disables SLSA provenance attestations
          provenance: false

      - name: Write job summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          TAGS: ${{ steps.meta.outputs.tags }}
          PUSHED: ${{ steps.meta.outputs.push }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "## tls-scanner image"
            echo ""
            echo "- source: ${TLS_SCANNER_REPO} @ ${SHORT_SHA}"
            echo "- tags: ${TAGS}"
            if [[ "$PUSHED" == "true" ]]; then
              echo "- digest: ${IMAGE_DIGEST}"
              echo "- pull: docker pull ${IMAGE}@${IMAGE_DIGEST}"
            else
              echo "- build-only run (image not pushed)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
